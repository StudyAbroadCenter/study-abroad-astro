name: Build Astro site

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Generate lightweight WebP images
        run: python scripts/optimize_images.py

      - name: Install dependencies
        run: npm install

      - name: Check and build Astro site
        run: npm run build

      - name: Upload built site for visual review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: astro-pr-preview
          path: dist
          retention-days: 7

      - name: Install Playwright runtime and browser
        if: github.event_name == 'pull_request'
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run Japanese visual UAT smoke
        if: github.event_name == 'pull_request'
        env:
          VISUAL_BASE_URL: http://127.0.0.1:4173
          VISUAL_OUTPUT_DIR: visual-uat
        run: |
          python -m http.server 4173 --directory dist > /tmp/astro-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 3
          node scripts/visual_uat.mjs

      - name: Upload Japanese visual UAT
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@v4
        with:
          name: japanese-visual-uat
          path: visual-uat
          retention-days: 7

      - name: Run English home visual UAT
        if: github.event_name == 'pull_request'
        env:
          VISUAL_BASE_URL: http://127.0.0.1:4174
          EN_VISUAL_OUTPUT_DIR: english-visual-uat
        run: |
          python -m http.server 4174 --directory dist > /tmp/astro-preview-en.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 3
          node scripts/english_visual_uat.mjs

      - name: Upload English home visual UAT
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@v4
        with:
          name: english-home-visual-uat
          path: english-visual-uat
          retention-days: 7

      - name: Run English RWJP visual UAT
        if: github.event_name == 'pull_request'
        env:
          VISUAL_BASE_URL: http://127.0.0.1:4175
          EN_RWJP_VISUAL_OUTPUT_DIR: english-rwjp-visual-uat
        run: |
          python -m http.server 4175 --directory dist > /tmp/astro-preview-en-rwjp.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 3
          node scripts/english_rwjp_visual_uat.mjs

      - name: Upload English RWJP visual UAT
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@v4
        with:
          name: english-rwjp-visual-uat
          path: english-rwjp-visual-uat
          retention-days: 7

      - name: Run English programme MVP visual UAT
        if: github.event_name == 'pull_request'
        env:
          VISUAL_BASE_URL: http://127.0.0.1:4176
          EN_PROGRAMMES_VISUAL_OUTPUT_DIR: english-programmes-visual-uat
        run: |
          python -m http.server 4176 --directory dist > /tmp/astro-preview-en-programmes.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 3
          node scripts/english_programmes_visual_uat.mjs

      - name: Upload English programme MVP visual UAT
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@v4
        with:
          name: english-programmes-visual-uat
          path: english-programmes-visual-uat
          retention-days: 7
